tags:
  - Contacts
summary: Delete contact by Id
operationId: deleteContact
description: 'Delete a contact by its ID'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: The contact ID
responses:
  '200':
    description: Successfully deleted a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully deleted contact!
            data:
              type: object
              example: {}
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
